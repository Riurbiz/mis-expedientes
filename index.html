<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Personas y Fotos</title>
    <!-- Tailwind CSS para un diseño limpio y adaptado a móviles -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Dexie.js para manejar la base de datos local del teléfono -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen pb-10">

    <div class="max-w-md mx-auto p-4">
        <header class="text-center my-6">
            <h1 class="text-2xl font-bold text-gray-800">Registro de Personas</h1>
            <p class="text-sm text-gray-500">Guarda datos y fotos localmente</p>
        </header>

        <!-- Formulario de Registro -->
        <div class="bg-white p-5 rounded-xl shadow-md mb-6">
            <h2 class="text-lg font-semibold mb-4 text-gray-700">Nueva Entrada</h2>
            <form id="registroForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase">Nombres y Apellidos</label>
                    <input type="text" id="nombre" required class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase">Cédula de Identidad (CI)</label>
                    <input type="text" id="ci" required class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase">Foto</label>
                    <input type="file" id="foto" accept="image/*" required class="w-full mt-1 text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>
                <div>
                    <label class="block text-xs font-medium text-gray-500 uppercase">Comentario de la Foto</label>
                    <textarea id="comentario" rows="2" class="w-full mt-1 p-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Escribe algo sobre la foto..."></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-medium hover:bg-blue-700 transition duration-200">
                    Guardar Registro
                </button>
            </form>
        </div>

        <!-- Lista de Registros -->
        <h2 class="text-xl font-bold text-gray-800 mb-4">Registros Guardados</h2>
        <div id="listaPersonas" class="space-y-4">
            <!-- Aquí se cargarán las tarjetas dinámicamente -->
        </div>
    </div>

    <script>
        // 1. Configurar la Base de Datos Local (IndexedDB)
        const db = new Dexie("RegistroPersonasDB");
        db.version(1).stores({
            personas: '++id, nombre, ci, foto, comentario, fecha'
        });

        const form = document.getElementById('registroForm');
        const lista = document.getElementById('listaPersonas');

        // 2. Función para renderizar los registros en la pantalla
        async function mostrarRegistros() {
            lista.innerHTML = '';
            const personas = await db.personas.reverse().toArray(); // Mostrar los más recientes primero

            if (personas.length === 0) {
                lista.innerHTML = `<p class="text-center text-gray-500 py-4">No hay registros guardados aún.</p>`;
                return;
            }

            personas.forEach(persona => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl shadow-md overflow-hidden border border-gray-200";
                
                // Formatear la fecha de subida
                const fechaFormateada = new Date(persona.fecha).toLocaleString('es-ES', {
                    day: '2-digit', month: '2-digit', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });

                card.innerHTML = `
                    <div class="p-4 border-b border-gray-100 bg-gray-50">
                        <h3 class="font-bold text-lg text-gray-800">${persona.nombre}</h3>
                        <p class="text-sm text-gray-600"><strong>CI:</strong> ${persona.ci}</p>
                    </div>
                    <div class="relative bg-black flex justify-center items-center max-h-64 overflow-hidden">
                        <img src="${persona.foto}" alt="Foto de ${persona.nombre}" class="w-full object-cover">
                    </div>
                    <div class="p-4 space-y-2">
                        <div class="bg-blue-50 p-3 rounded-lg border-l-4 border-blue-500">
                            <p class="text-xs font-semibold text-blue-800 uppercase tracking-wider mb-1">Comentario</p>
                            <p class="text-sm text-gray-700 italic">"${persona.comentario || 'Sin comentario.'}"</p>
                        </div>
                        <div class="pt-2 text-right">
                            <span class="text-xs text-gray-400 font-medium block">Subido el: ${fechaFormateada}</span>
                        </div>
                        <button onclick="eliminarRegistro(${persona.id})" class="mt-2 text-xs w-full bg-red-50 text-red-600 py-1.5 rounded-md hover:bg-red-100 transition font-medium">
                            Eliminar Registro
                        </button>
                    </div>
                `;
                lista.appendChild(card);
            });
        }

        // 3. Escuchar el envío del formulario
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const nombre = document.getElementById('nombre').value;
            const ci = document.getElementById('ci').value;
            const comentario = document.getElementById('comentario').value;
            const fotoFile = document.getElementById('foto').files[0];

            if (!fotoFile) return;

            // Convertir la imagen a Base64 para guardarla en la BD
            const reader = new FileReader();
            reader.readAsDataURL(fotoFile);
            reader.onloadend = async () => {
                const fotoBase64 = reader.result;

                // Insertar en la base de datos
                await db.personas.add({
                    nombre,
                    ci,
                    foto: fotoBase64,
                    comentario,
                    fecha: Date.now() // Guarda la fecha y hora exacta actual
                });

                // Resetear formulario y actualizar vista
                form.reset();
                mostrarRegistros();
            };
        });

        // 4. Función para eliminar un registro
        async function eliminarRegistro(id) {
            if (confirm("¿Estás seguro de que deseas eliminar este registro?")) {
                await db.personas.delete(id);
                mostrarRegistros();
            }
        }

        // Cargar datos al iniciar la página
        mostrarRegistros();
    </script>
</body>
</html>
